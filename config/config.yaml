# TrendRadar 配置文件 - 浙江省考时政新闻采集
timezone: Asia/Shanghai

# RSS 新闻源配置
rss:
  enabled: true
  feeds:
    - id: zj-gov
      name: 浙江省人民政府官网新闻
      url: https://www.zj.gov.cn/col/col1229440/index.xml
    - id: zj-agri
      name: 浙江省农业农村厅
      url: https://nynct.zj.gov.cn/col/col1229275/index.xml
    - id: zj-eco
      name: 浙江省经信厅（产业/制造业）
      url: https://jxw.zj.gov.cn/col/col1229187/index.xml
    - id: zj-weather
      name: 浙江气象预警
      url: https://zj.cma.gov.cn/rss.xml

# AI 大模型配置（已经对接DeepSeek，无需修改）
llm:
  enabled: true
  api_base: "${{ secrets.LLM_BASE_URL }}"
  api_key: "${{ secrets.LLM_API_KEY }}"
  model: deepseek-chat

# 存储配置，使用Cloudflare R2
storage:
  type: s3
  s3:
    endpoint: "${{ secrets.R2_ENDPOINT }}"
    access_key_id: "${{ secrets.R2_ACCESS_KEY_ID }}"
    secret_access_key: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
    bucket: "${{ secrets.R2_BUCKET_NAME }}"

# 推送设置：钉钉（可选，不需要就把enabled改成false）
notify:
  dingtalk:
    enabled: false
    webhook: "${{ secrets.DINGTALK_WEBHOOK }}"

# 新闻保留天数
retention_days: 30
