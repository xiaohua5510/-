# TrendRadar 配置文件 - 浙江省考时政新闻采集（仅DeepSeek，无R2）
timezone: Asia/Shanghai

# 关键词设置为空数组：不做关键词过滤，抓到的全部时政新闻保留
keywords: []

# RSS 新闻源配置
rss:
  enabled: true
  feeds:
    - id: zj-gov
      name: 浙江省人民政府官网新闻
      url: https://www.zj.gov.cn/col/col1229440/index.xml
    - id: zj-agri
      name: 浙江省农业农村厅
      url: https://nynct.zj.gov.cn/col/col1229275/index.xml
    - id: zj-eco
      name: 浙江省经信厅（产业/制造业）
      url: https://jxw.zj.gov.cn/col/col1229187/index.xml
    - id: zj-weather
      name: 浙江气象预警
      url: https://zj.cma.gov.cn/rss.xml

# AI分析开启
ai_analysis:
  enabled: true

# AI 大模型配置 DeepSeek
llm:
  enabled: true
  api_base: "https://api.deepseek.com"
  api_key: "${{ secrets.LLM_API_KEY }}"
  model: deepseek-chat

# 存储改成本地，不使用Cloudflare R2！
storage:
  type: local

# 推送设置：钉钉
notify:
  dingtalk:
    enabled: false
    webhook: "${{ secrets.DINGTALK_WEBHOOK }}"

# 新闻保留天数
retention_days: 30
