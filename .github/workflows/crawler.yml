name: Get Hot News
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
concurrency:
  group: ${{github.ref_name}}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check Expiration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_FILE="crawler.yml"
          API_URL="repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}"
          TOTAL=$(gh api $API_URL | jq -r '.total_count')
          if [ "$TOTAL" = "null" ] || [ "$TOTAL" -eq 0 ]; then
            echo "No previous runs, skip expiration check"
            exit 0
          fi
          LAST_RUN_DATE=$(gh api $API_URL/runs | jq -r '.items[0].created_at')
          if [ -z "$LAST_RUN_DATE" ]; then
            echo "No run date found"
            exit 0
          fi
          CURRENT=$(date +%s)
          LAST=$(date -d "$LAST_RUN_DATE" +%s)
          DIFF_SEC=$((CURRENT - LAST))
          LIMIT_SEC=604800
          if [ $DIFF_SEC -gt $LIMIT_SEC ]; then
            echo "⚠️ 试用期已结束，请手动触发一次Workflow来续期"
            gh api --method PUT repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/disable
            exit 1
          else
            DAYS=$((DIFF_SEC / 86400))
            echo "✅ 剩余续期天数：$((7 - DAYS))"
          fi
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --frozen
      - name: Verify config file
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "❌ Missing config/config.yaml"
            exit 1
          fi
      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          AI_ANALYSIS_ENABLED: true
          AI_API_KEY: ${{ secrets.LLM_API_KEY }}
          AI_MODEL: deepseek-chat
          AI_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Prepare static assets
        if: success()
        run: |
          if [ ! -f index.html ]; then
            echo "❌ 爬虫没有生成 index.html"
            exit 1
          fi
          rm -rf cloudflare_dist
          mkdir -p cloudflare_dist
          cp index.html cloudflare_dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cloudflare_dist
          publish_branch: gh-pages

      - name: DingTalk Notify
        if: always()
        run: |
          GITHUB_PAGE_URL="https://xiaohua5510.github.io/你的仓库名/"
          if [[ ${{job.status}} == "success" ]];then
            MSG="Get Hot News 任务执行成功\n仓库：${{github.repository}}\n分支：${{github.ref_name}}\n运行链接：${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}\n新闻页面：${GITHUB_PAGE_URL}"
          else
            MSG="Get Hot News 任务执行失败\n仓库：${{github.repository}}\n分支：${{github.ref_name}}\n运行链接：${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}"
          fi
          curl -s ${{secrets.DINGTALK_WEBHOOK}} \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MSG\"}}"
